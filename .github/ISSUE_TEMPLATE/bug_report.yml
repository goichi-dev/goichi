name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything with security impact, please follow
        [SECURITY.md](../blob/master/SECURITY.md) instead of filing a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: >
        The smallest program that shows the problem, plus the request that
        triggers it (a curl command is ideal).
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Goichi version
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: output of `go version`
    validations:
      required: true

  - type: dropdown
    id: protocol
    attributes:
      label: Which part is affected
      multiple: true
      options:
        - Routing
        - Middleware
        - Auth / JWT
        - OpenAPI docs
        - WebSocket
        - GraphQL
        - gRPC / ConnectRPC
        - MQTT
        - MCP
        - Other
    validations:
      required: true
