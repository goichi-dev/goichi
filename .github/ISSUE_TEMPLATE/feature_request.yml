name: Feature request
description: Suggest a capability Goichi does not have yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to build that Goichi makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch how it would look from a user's code.
      render: go

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including what you do today as a workaround.
